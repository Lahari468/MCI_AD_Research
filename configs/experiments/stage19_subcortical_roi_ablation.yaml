# Stage 19 Experiment Configuration
experiment:
  name: "Stage 19 Anatomical Subcortical MRI ROI Incremental Experiment"
  cohort:
    matched_development_n: 564
    converters: 123
    non_converters: 441
    conversion_prevalence: 0.2181
  protocol:
    repeats: 3
    folds_per_repeat: 5
    total_model_runs_per_model: 15
  models_compared:
    clinical_only: "Clinical 10 Features"
    model_a: "Clinical 10 + FreeSurfer FS29 (39 features)"
    model_b: "Clinical 10 + FreeSurfer FS29 + 16 Subcortical MRI ROI Features (55 features)"
    model_c: "Clinical 10 + FreeSurfer FS29 + 16 Target ROIs + 6 Control ROIs (61 features)"
    mri_roi_only: "16 Subcortical MRI ROI Features Alone"
    model_b_gbm: "HistGradientBoosting on Model B Features"
  evaluation:
    bootstrap_resamples: 2000
    random_seed: 42
    unit: "participant_level_repeat_averaged"
    primary_contrast: "Model B minus Model A"
  reported_findings:
    model_a_pooled_auroc: 0.8643
    model_b_pooled_auroc: 0.8688
    delta_auroc: 0.0044
    ci_95: [-0.0029, 0.0122]
    empirical_tail_p_value: 0.2440
    clinical_vs_model_a_delta: 0.0433
    clinical_vs_model_a_ci: [0.0135, 0.0747]
    clinical_vs_model_a_p: 0.0020
    conclusion: "Incremental value of anatomical subcortical MRI ROIs beyond Clinical + FS29 is not statistically significant (p = 0.2440)"
