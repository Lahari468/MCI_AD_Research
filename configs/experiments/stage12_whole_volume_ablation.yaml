# Stage 12 Experiment Configuration
experiment:
  name: "Stage 12 Whole-Volume 3D MRI 3-Repeat Ablation"
  cohort:
    development_n: 622
    converters: 144
    non_converters: 478
  protocol:
    repeats: 3
    folds_per_repeat: 5
    total_model_runs_per_model: 15
  models_compared:
    model_a: "Clinical 10 + FreeSurfer FS29 Attention (MRI Excluded)"
    model_b: "Clinical 10 + FreeSurfer FS29 + Baseline 3D MRI Attention"
  evaluation:
    bootstrap_resamples: 2000
    random_seed: 42
    primary_metric: "auroc"
    secondary_metrics: ["prauc", "brier", "sensitivity", "specificity"]
  reported_findings:
    model_a_pooled_auroc: 0.8517
    model_b_pooled_auroc: 0.8587
    delta_auroc: 0.0070
    ci_95: [-0.0057, 0.0197]
    empirical_p_value: 0.2860
    conclusion: "Incremental value of raw 3D MRI is not statistically significant (p > 0.05)"
