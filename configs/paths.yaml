    harvard_oxford_subcortical: "data/reference/atlases/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz"
    mni152_brain_mask: "data/reference/atlases/MNI152_T1_2mm_brain_mask.nii.gz"

results:
