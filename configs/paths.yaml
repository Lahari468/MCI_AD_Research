  feature_ablation: "results/01_feature_ablation"
  whole_volume_3d_mri: "results/02_whole_volume_3d_mri"
  subcortical_mri_roi: "results/03_subcortical_mri_roi"
  final_comparison: "results/04_final_comparison"
  figures: "results/figures"
