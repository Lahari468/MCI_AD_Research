# configs/paths.yaml - Centralized Portable Path Configuration
project_root: "${PROJECT_ROOT:-.}"
fsldir: "${FSLDIR:-}"

data:
  raw:
    clinical: "data/raw/clinical"
    freesurfer: "data/raw/freesurfer"
    mri_roots:
      - "data/raw/mri/batch1_combined"
      - "data/raw/mri/batch2_combined"
      - "data/raw/mri/batch3_combined"
  interim:
    tensors_v2: "data/interim/mri_mni2mm_v2"
    tensors_qcfail: "data/interim/mri_mni2mm_v2_qcfail"
