    cohort: "data/processed/cohort_v2b.csv"
    splits: "data/processed/splits/splits_v1.csv"
    features_clinical: "data/processed/features/clinical_raw_v1.csv"
    features_fs29: "data/processed/features/freesurfer29_raw_v1.csv"
    features_roi: "data/processed/features/mri_subcortical_roi_features.csv"
    mri_manifest: "data/processed/mri/manifests/mri_manifest_713.csv"

reference:
