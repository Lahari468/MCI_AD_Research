# Subcortical MRI ROI Models Configuration (Stage 19)
models:
  primary_linear:
    type: "logistic_regression"
    penalty: "l2"
    solver: "lbfgs"
    c_grid: [0.001, 0.01, 0.05, 0.1, 0.5, 1.0, 5.0, 10.0]
    max_iter: 2000
    inner_val_ratio: 0.15
  secondary_nonlinear:
    type: "hist_gradient_boosting"
    max_iter: 100
    learning_rate: 0.05
    max_depth: 3
    early_stopping: false
