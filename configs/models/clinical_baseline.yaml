# Clinical Baseline Model Configuration
model:
  name: "Clinical L2 Logistic Regression"
  type: "logistic_regression"
  penalty: "l2"
  solver: "lbfgs"
  max_iter: 2000
  regularization_grid: [0.001, 0.01, 0.05, 0.1, 0.5, 1.0, 5.0, 10.0]
  threshold_selection:
    criterion: "youden_j"
    search_range: [0.10, 0.90]
    num_steps: 81
  inner_validation_split_ratio: 0.15
